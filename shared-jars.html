<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared jars — Memory Jam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shared">
  <div class="starfield starfield--subtle" aria-hidden="true"></div>

  <header class="site-header site-header--compact">
    <a class="text-link" href="index.html">← Home</a>
    <h1 class="site-title site-title--smaller">Shared jars</h1>
  </header>

  <main class="shared-main">
    <p class="page-lead">Profiles use real photos from a public CDN. Add your own line below—it saves in this browser so everyone building on the same device can collaborate.</p>

    <div class="shared-grid" id="shared-grid">
      <!-- Seeded entries + user additions rendered by memoryjam.js -->
    </div>

    <section class="add-jar" aria-labelledby="add-jar-heading">
      <h2 id="add-jar-heading" class="add-jar__title">Add to the shared wall</h2>
      <form class="add-jar__form" id="add-jar-form">
        <label class="add-jar__field">
          <span>Your name</span>
          <input type="text" name="name" required maxlength="60" placeholder="e.g. Sam Lee" autocomplete="name">
        </label>
        <label class="add-jar__field">
          <span>One memory line</span>
          <textarea name="line" required maxlength="220" rows="3" placeholder="A single sentence for the jar…"></textarea>
        </label>
        <label class="add-jar__field">
          <span>Photo (optional URL)</span>
          <input type="url" name="photo" maxlength="500" placeholder="https://… or leave blank for a random portrait">
        </label>
        <button type="submit" class="btn btn-primary">Add to shared jars</button>
      </form>
    </section>
  </main>

  <script src="memoryjam.js"></script>
</body>
</html>
