<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your jars — Memory Jam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-jars">
  <div class="starfield starfield--subtle" aria-hidden="true"></div>

  <header class="site-header site-header--compact">
    <a class="text-link" href="index.html">← Home</a>
    <h1 class="site-title site-title--smaller">Your jars</h1>
  </header>

  <main class="jars-main">
    <p class="page-lead">Tap a jar to imagine opening it—each box is sized so the full label stays inside.</p>
    <div class="jar-grid">
      <button type="button" class="jar-box">
        <span class="jar-box__title">Rainy windows</span>
        <span class="jar-box__body">Bus rides, fogged glass, someone humming off-key.</span>
      </button>
      <button type="button" class="jar-box">
        <span class="jar-box__title">Kitchen light</span>
        <span class="jar-box__body">Yellow bulb, flour on the counter, the clock always six minutes fast.</span>
      </button>
      <button type="button" class="jar-box">
        <span class="jar-box__title">Late messages</span>
        <span class="jar-box__body">Blue glow, “are you still up?”, thumbs hovering before send.</span>
      </button>
      <button type="button" class="jar-box">
        <span class="jar-box__title">Summer pavement</span>
        <span class="jar-box__body">Bare feet, chalk outlines, the ice-cream truck two blocks away.</span>
      </button>
    </div>
  </main>

  <script src="memoryjam.js"></script>
</body>
</html>
